[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camerobot"
version = "0.1.0"
description = "MVP0 software scaffold for a personal robot photographer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
flyvision = ["opencv-python-headless>=4.8"]

[project.scripts]
camerobot = "camerobot.cli:main"
flyvision = "flyvision.cli:main"

[tool.setuptools]
packages = ["camerobot", "flyvision"]

[tool.setuptools.package-dir]
flyvision = "flyvision/python/flyvision"
